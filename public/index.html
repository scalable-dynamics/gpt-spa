<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1A202C">
    <title>biz-bot · bots</title>
    <meta name="app-version" content="2.0.0">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <input type="checkbox" id="sidebar-toggle" name="showSidebar" />
        <label for="sidebar-toggle" class="sidebar-toggle-label">☰</label>
        <label for="sidebar-toggle" class="sidebar-scrim" aria-hidden="true"></label>
        <aside>
            <div class="brand"><span class="brand-name">biz-bot</span><span class="brand-sub">bots that work together</span></div>
            <nav>
                <h4>Bots <button id="create-button" class="mini" title="Create a bot">+ New</button></h4>
                <ul id="bot-links"></ul>
                <h4>Rooms <button id="create-swarm-button" class="mini" title="Create a room — a group chat of bots">+ New</button></h4>
                <ul id="swarm-links"></ul>
            </nav>
            <footer>
                <button id="settings-button" class="ghost">⚙ Settings</button>
                <span id="conn-status" class="conn-status" title="Worker connection">●</span>
            </footer>
        </aside>
        <main>
            <header class="topbar">
                <div class="topbar-title">
                    <span id="title-avatar"></span>
                    <div>
                        <h1 id="title">biz-bot</h1>
                        <div id="title-meta" class="title-meta"></div>
                    </div>
                </div>
                <div class="topbar-actions">
                    <button id="restart-button" class="ghost" title="Start a fresh conversation">↺ Restart</button>
                    <button id="share-button" class="ghost" title="Copy a share link">⤴ Share</button>
                    <button id="voice-button" class="ghost" title="Realtime voice conversation (xAI Grok voice, beta)" hidden>🎙 Voice</button>
                    <button id="edit-swarm-button" class="ghost" title="Edit room members" hidden>✎ Members</button>
                </div>
            </header>
            <div class="tabs" id="tabs">
                <button class="tab-btn active" data-tab="chat">Chat</button>
                <button class="tab-btn" data-tab="config" id="config-tab-btn">Configure</button>
            </div>
            <div id="busy-bar" class="busy-bar" hidden><div></div></div>
            <div id="setup-banner" class="setup-banner" hidden></div>
            <section id="chat-panel" class="content">
                <div id="output-container" class="output-container"></div>
                <div class="input-container">
                    <div id="attachments" class="attachments"></div>
                    <div class="input-content">
                        <label title="Add files (PDF, text, images, audio)" class="icon-btn">
                            <input id="upload" name="upload" type="file" multiple />
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 9l5 -5l5 5" /><path d="M12 4l0 12" /></svg>
                        </label>
                        <button id="mic-button" class="icon-btn" title="Speech input">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2m0 3a3 3 0 0 1 3 -3h0a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3h0a3 3 0 0 1 -3 -3z" /><path d="M5 10a7 7 0 0 0 14 0" /><path d="M8 21l8 0" /><path d="M12 17l0 4" /></svg>
                        </button>
                        <textarea id="chat-input" placeholder="Message…" title="Tip: @Bot addresses a bot in a room; /skill loads a skill" rows="1"></textarea>
                        <button id="stop-button" class="icon-btn stop" title="Stop" hidden>■</button>
                        <button id="send-button" class="icon-btn send" title="Send message">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14l11 -11" /><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" /></svg>
                        </button>
                    </div>
                    <div class="input-hint" id="input-hint"></div>
                </div>
            </section>
            <section id="config-panel" class="content" hidden>
                <div id="form"></div>
                <div class="buttons">
                    <button id="delete-button" class="btn danger">Delete</button>
                    <button id="duplicate-button" class="btn secondary">Duplicate</button>
                    <span class="spacer"></span>
                    <button id="cancel-button" class="btn secondary">Cancel</button>
                    <button id="save-button" class="btn">Save</button>
                </div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
